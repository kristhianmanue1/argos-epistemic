[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-epistemic"
version = "0.1.0"
description = "Implementacion de referencia del Modelo Epistemico Unificado (argos)"
readme = "readme.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "KRISTHIAN MANUEL" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "an-kla-memory==0.1.0b1",
]
languages = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
]

[tool.setuptools]
packages = ["argos_epistemic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

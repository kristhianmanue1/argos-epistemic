[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-epistemic"
version = "0.2.0.dev0"
description = "Implementacion de referencia del Modelo Epistemico Unificado (argos)"
readme = "readme.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "KRISTHIAN MANUEL" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "an-kla-memory @ git+https://github.com/kristhianmanue1/an-kla-memory.git@67f6ee486a4235e43ca16d8f701eb8722aaad68a",
    "ruff>=0.6",
    "mypy>=1.11",
]
languages = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
]
semantic = [
    "sentence-transformers>=2.7",
]

[tool.setuptools]
packages = ["argos_epistemic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# E501 (line-length) queda como advisory: el código preexistente y los fixtures
# tienen prosa en español y strings realistas >100. Imponerlo sería un refactor
# de churn alto ajeno a la higiene de corrección (F/B/UP/I/SIM/RUF).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Fixtures llevan contenido de artefactos realista (prosa larga) por diseño.
"bench/fixtures.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["argos_epistemic"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# La impl de referencia usa dict[str, Any] para system/goal/artifacts a propósito;
# no perseguimos Any globalmente.
disable_error_code = []

[[tool.mypy.overrides]]
module = ["numpy", "sentence_transformers", "tree_sitter"]
ignore_missing_imports = true

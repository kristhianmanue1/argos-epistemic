[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-model"
version = "0.1.0"
description = "Implementacion de referencia del Modelo Epistemico Unificado (argos)"
readme = "readme.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "KRISTHIAN MANUEL" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "an-kla-memory==0.1.0b1",
]

[tool.setuptools]
packages = ["argos_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

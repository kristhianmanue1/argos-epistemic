name: Reporte de bug
description: Reporta un comportamiento reproducible incorrecto
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Comportamiento observado
      description: Incluye el resultado y el comportamiento esperado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducción mínima
      description: Usa datos públicos o saneados; no incluyas secretos.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python y sistema operativo
      description: Por ejemplo, Python 3.12.5 en Ubuntu 24.04 o macOS 15.
      placeholder: Python 3.12.x · sistema y versión
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Método de instalación
      options:
        - Wheel de GitHub Release
        - Source distribution de GitHub Release
        - Checkout editable
        - Otro
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico saneado
      description: Incluye reason_codes, degradaciones o salida mínima útil. No incluyas secretos, rutas privadas ni contenido confidencial del target.
      render: shell
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Modelo o semántica
        - Bundle o schema
        - Discovery o presupuesto
        - Extractores
        - Documentación
        - Instalación o empaquetado
        - Ayuda informativa
        - Otro
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Seguridad
      options:
        - label: Confirmo que esto no contiene una vulnerabilidad ni secretos; esos reportes siguen SECURITY.md.
          required: true

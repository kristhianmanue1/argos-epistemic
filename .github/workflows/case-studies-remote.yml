name: Case studies (remote targets)

# Policy (plan §5.1): the pinned third-party case studies need network access to
# fetch their target revision and the dense semantic profile, so they are NOT
# part of the per-PR gate, which must stay deterministic and offline. They run
# on a schedule and on demand instead.
#
# This job fails closed. An unreachable target reports `unavailable` and a
# checkout that lands elsewhere reports `invalid_revision`; neither is treated
# as success, because "we could not check" is the exact drift the gate exists
# to surface.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  remote-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[semantic]' --no-deps
          pip install -r requirements.txt
          pip install "sentence-transformers>=3" "setuptools>=68" "wheel>=0.43"
      - name: Verify pinned third-party case studies
        run: |
          python examples/regenerate_case_studies.py --target markupsafe --check
          python examples/regenerate_case_studies.py --target an-kla-memory --check

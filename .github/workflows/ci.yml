name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install -r requirements.txt
          pip install "pytest>=8" "ruff>=0.6" "mypy>=1.11" "setuptools>=68" "wheel>=0.43"
      - name: Lint (ruff)
        run: python -m ruff check argos_epistemic bench tests scripts
      - name: Type check (mypy)
        run: python -m mypy argos_epistemic
      - name: pytest
        run: python -m pytest -q
      - name: Demo smoke
        run: python -c "import argos_epistemic; r=argos_epistemic.run(); assert isinstance(r, dict) and 'coverage' in r"
      # Deterministic subset only: the self-study needs no network. The pinned
      # third-party cases are verified by case-studies-remote.yml, which fails
      # closed on an unreachable target instead of reporting it as success.
      - name: Case studies freshness (deterministic)
        run: python examples/regenerate_case_studies.py --target argos --check
      - name: Benchmark freshness
        run: python bench/run_benchmark.py --check
      - name: AN-KLA context integrity
        run: |
          if python -c "import an_kla" 2>/dev/null; then
            python -m an_kla --project-root . context status
          else
            python scripts/check_an_kla_context.py
          fi
